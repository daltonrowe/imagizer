<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="In-browser image effect editor. Crop, position and export photos without uploading them anywhere.">
<title>Imagizer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <h1>Imagizer</h1>
  <div class="topbar-actions">
    <span id="quality" class="badge" hidden></span>
    <button id="pick" class="btn btn-quiet" type="button">Choose photo</button>
  </div>
</header>

<main class="editor">
  <section id="stage" class="stage" aria-label="Crop preview">
    <div id="layerHost" class="layer-host">
      <canvas id="layer" class="layer"></canvas>
    </div>
    <canvas id="preview" class="preview" hidden></canvas>
    <div id="frame" class="frame" aria-hidden="true"></div>

    <div id="empty" class="empty">
      <div class="empty-inner">
        <p class="empty-title">Drop a photo here</p>
        <p class="empty-sub">or use <strong>Choose photo</strong> to pick one from your camera roll</p>
      </div>
    </div>
  </section>

  <section class="controls" aria-label="Editor settings">
    <div class="steps" role="tablist" aria-label="Editing steps">
      <button class="step" id="tabCrop" type="button" role="tab" aria-selected="true" aria-controls="paneCrop">
        <span class="step-num">1</span> Crop
      </button>
      <span class="step-arrow" aria-hidden="true">&rarr;</span>
      <button class="step" id="tabEffects" type="button" role="tab" aria-selected="false" aria-controls="paneEffects">
        <span class="step-num">2</span> Effects <span id="chainCount" class="count" hidden></span>
      </button>
    </div>

    <div class="panes">
    <div class="pane" id="paneCrop" role="tabpanel" aria-labelledby="tabCrop">
    <div class="presets" id="presets" role="group" aria-label="Crop size presets"></div>

    <div class="row row-inline">
      <div class="field">
        <label for="cropW">Width</label>
        <input id="cropW" type="number" inputmode="numeric" min="16" max="8192" step="1">
      </div>
      <button id="swap" class="btn btn-icon" type="button" title="Swap width and height" aria-label="Swap width and height">&#8646;</button>
      <div class="field">
        <label for="cropH">Height</label>
        <input id="cropH" type="number" inputmode="numeric" min="16" max="8192" step="1">
      </div>
      <div class="field field-unit"><span>px</span></div>
    </div>

    <div class="row row-inline row-zoom">
      <label class="inline-label" for="zoom">Zoom</label>
      <input id="zoom" class="slider" type="range" min="1" max="8" step="0.01" value="1">
      <span id="zoomVal" class="mono zoom-val">1.00&times;</span>
      <button id="reset" class="btn btn-quiet" type="button">Reset</button>
    </div>

    </div><!-- /paneCrop -->

    <div class="pane" id="paneEffects" role="tabpanel" aria-labelledby="tabEffects" hidden>
      <p class="step-note">Applied to the crop from step&nbsp;1, top to bottom</p>

      <div class="row row-inline">
        <div class="field">
          <label class="visually-hidden" for="addEffect">Add an effect</label>
          <select id="addEffect"></select>
        </div>
        <button id="randomizeChain" class="btn" type="button" title="Build a random chain of 2-5 effects">Randomize</button>
        <button id="clearChain" class="btn btn-icon" type="button" title="Remove all effects" aria-label="Remove all effects">&times;</button>
      </div>

      <ol id="chain" class="chain"></ol>
      <p id="chainEmpty" class="hint hint-empty">No effects yet. Add one, or hit Randomize for a chain of 2&ndash;5.</p>

      <details class="json" id="jsonPanel">
        <summary>Chain JSON</summary>
        <textarea id="json" class="json-text" rows="7" spellcheck="false" autocapitalize="off"
                  autocorrect="off" aria-label="Effect chain as JSON"></textarea>
        <div class="row-inline json-actions">
          <button id="jsonCopy" class="btn" type="button">Copy</button>
          <button id="jsonDownload" class="btn" type="button">Download</button>
          <button id="jsonApply" class="btn btn-primary" type="button">Apply</button>
        </div>
      </details>
    </div><!-- /paneEffects -->
    </div><!-- /panes -->

    <div class="stepnav">
      <button id="toCrop" class="btn btn-back" type="button" hidden>&larr; Back to crop</button>
      <button id="toEffects" class="btn btn-next" type="button">Next: add effects &rarr;</button>
    </div>

    <div class="footer">
    <div class="row row-inline row-seed">
      <label class="inline-label" for="seed">Seed</label>
      <input id="seed" class="seed-input" type="text" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" maxlength="32">
      <button id="randomize" class="btn btn-icon" type="button" title="Randomize seed" aria-label="Randomize seed">&#127922;</button>
    </div>

    <div class="row row-inline row-actions">
      <div class="field field-format">
        <label class="visually-hidden" for="format">Export format</label>
        <select id="format">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
        </select>
      </div>
      <button id="export" class="btn btn-primary" type="button" disabled>Export crop</button>
    </div>

    <p class="hint">Drag to position &middot; pinch to zoom &middot; double&#8209;tap to reset</p>
    </div><!-- /footer -->
  </section>
</main>

<input id="file" class="visually-hidden" type="file" accept="image/*">
<a id="download" class="visually-hidden" download></a>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
